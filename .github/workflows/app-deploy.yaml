name: Deploy app

on:
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

jobs:
    login:
        runs-on: ubuntu-latest

        steps:
            - name: Sign in to Azure
              uses: azure/login@v2
              with:
                  client-id: ${{ vars.AZURE_CLIENT_ID}}
                  tenant-id: ${{ vars.AZURE_TENANT_ID}}
                  subscription-id: ${{vars.AZURE_SUBSCRIPTION_ID}}
